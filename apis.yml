aid: fabhotels
name: FabHotels
description: 'FabHotels is an Indian branded-budget hotel chain and online booking platform,
  founded in 2014 by Vaibhav Aggarwal and Adarsh Manpuria and headquartered in Gurugram.
  It operates a network of 1500+ standardized economy hotels across 80+ cities under the
  FabHotel, FabHotel Prime, and Via brands, with quality-controlled amenities such as free
  WiFi, air conditioning, and 24/7 security. Consumers book stays through the FabHotels
  website and its iOS and Android apps; the company also runs a franchise program for
  property owners and corporate-stay offerings, and is backed by Accel and Goldman Sachs.
  No public developer API, SDK, or partner integration surface is advertised — this remains
  a business-to-consumer travel brand rather than an API provider.'
